name: Daily Rain Checker

on:
  schedule:
    # 每天台灣時間早上 7:00 執行 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 允許在 GitHub 頁面上手動觸發測試

jobs:
  check-rain:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行降雨偵測腳本
        env:
          # 安全引用 GitHub Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
